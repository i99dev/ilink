# BYD catalog metadata — sparse overrides for catalog.tsv entries.
#
# Format: one entry per catalog name. Only document features that
# need a description / unit / value-semantics override beyond what
# the SDK can derive from the name itself. Untouched entries surface
# with a humanised name as the description and `int` as the type.
#
# Adding an entry:
#   - Find the catalog name in `catalog.tsv`.
#   - Add a YAML key here with at least `desc:` (one-line human
#     description). All other fields are optional.
#
# Fields:
#   desc:          short human-readable label ("Battery state of charge")
#   unit:          UI display unit ("%", "°C", "kPa", "km")
#   value_kind:    `int` (default) | `double` | `bytes` | `int_array`
#   semantics:     enum or scale notes for non-numeric values
#                  (e.g., "1=on, 2=off" or "kPa×10")
#   dt_hint:       BYD device_type the framework dispatches under
#                  (saves runtime probing — see catalog.tsv comment)
#   read_only:     true (default) | false
#                  When false, the SDK exposes the feature via the
#                  write API in addition to read.
#   category:      UI grouping hint ("doors", "climate", "battery")
#                  Defaults to the namespace prefix.
#
# Verified live entries get a `_verified: <date> on <trim>` tag so
# we know which ones survived a cross-trim test.

# ── Battery / charging ────────────────────────────────────────────
"Statistic.STATISTIC_SOC_BATTERY_PERCENTAGE":
  desc: Battery state of charge
  unit: "%"
  category: battery
  _verified: "2026-05-12 on Leopard 8 (DiLink5.1)"

"Statistic.STATISTIC_ELEC_DRIVING_RANGE":
  desc: EV driving range
  unit: km
  category: battery

"Statistic.STATISTIC_FUEL_DRIVING_RANGE":
  desc: Fuel driving range (PHEV / ICE)
  unit: km
  category: battery

"Charging.CHARGING_POWER":
  desc: Current charging power
  unit: kW
  category: charging

