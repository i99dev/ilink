name: ilink
description: "iLINK — head-unit companion for BYD (Leopard 8 + DiLink 5.1)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.22.0-b+3022000

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_secure_storage: ^10.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.5.5
  sherpa_onnx: ^1.13.3
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  uuid: ^4.5.3
  flutter_svg: ^2.0.10+1
  flutter_cache_manager: ^3.4.2
  intl: ^0.20.2
  just_audio: ^0.10.0
  just_audio_background: ^0.0.1-beta.17
  package_info_plus: ^9.0.1
  crypto: ^3.0.0
  geolocator: ^14.0.2
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  flutter_inappwebview: ^6.1.5
  archive: ^4.0.2
  path_provider: ^2.1.5
  app_links: ^7.0.0


  file_picker: ^8.1.7

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  sqflite_common_ffi: ^2.3.4+4

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

# Design master is `assets/branding/ilink_icon.svg` (dark variant)
# + `ilink_icon_light.svg`. `ilink_icon.png` is the 1024-px raster
# export the launcher generator consumes — flutter_launcher_icons
# (v0.14.4) only accepts PNG. Re-export the PNG from the SVG whenever
# the design changes:
#   node scripts/svg2png.mjs \
#        assets/branding/ilink_icon.svg \
#        assets/branding/ilink_icon.png 1024
#   dart run flutter_launcher_icons
# min_sdk_android matches the 23 floor enforced by
# android/app/build.gradle (flutter_secure_storage Keystore).
flutter_launcher_icons:
  image_path: "assets/branding/ilink_icon.png"
  android: "ic_launcher"
  min_sdk_android: 23
  adaptive_icon_background: "#0A1F44"
  adaptive_icon_foreground: "assets/branding/ilink_icon.png"
  adaptive_icon_foreground_inset: 25
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0A1F44"
  web:
    generate: true
    image_path: "assets/branding/ilink_icon.png"
    background_color: "#0A1F44"
    theme_color: "#0A1F44"
  windows:
    generate: true
    image_path: "assets/branding/ilink_icon.png"
    icon_size: 256

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/offline/mini_apps/
    - assets/branding/cubetek.svg
    - assets/branding/qev.jpg
    - assets/branding/ilink_icon.svg
    - assets/branding/ilink_icon_light.svg

    # BYD framework catalog — single source of truth for the SDK at
    # lib/sdk/byd/. Public TSV + YAML tracked directly in this repository;
    # no private submodule or build-time staging is required.
    - assets/byd/
    - assets/radio/catalog.json

    # SIL OFL 1.1 text for the bundled Cairo + Inter faces. Shipped in the
    # APK because the fonts are redistributed with it; surfaced through
    # LicenseRegistry in lib/main.dart.
    - assets/fonts/OFL.txt

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
